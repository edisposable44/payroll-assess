[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Prevent browsers/CDN from caching the app shells so every redeploy is
# immediately visible (no stale "old version" served from cache after a fix).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Candidates land on index.html by default; recruiters go to /admin.html
# directly (not linked from the candidate-facing page — see DEPLOIEMENT.md).
